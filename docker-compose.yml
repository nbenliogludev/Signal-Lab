services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signal_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_lab_password}
      POSTGRES_DB: ${POSTGRES_DB:-signal_lab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /workspace/apps/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://signal_lab:signal_lab_password@postgres:5432/signal_lab?schema=public}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      PORT: ${BACKEND_PORT:-3001}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/var/log/signal-lab/backend.log}
      SENTRY_DSN: ${SENTRY_DSN:-https://examplePublicKey@o0.ingest.sentry.io/0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/apps/backend/node_modules
      - backend_logs:/var/log/signal-lab
    command: sh -c "cd /workspace && npm install && npm run prisma:generate && npm run prisma:migrate:deploy && cd apps/backend && npm install && npm run start:dev"

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /workspace/apps/frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/apps/frontend/node_modules
      - frontend_next:/workspace/apps/frontend/.next
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3102:3100"
    volumes:
      - ./ops/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    depends_on:
      - loki
      - backend
    volumes:
      - ./ops/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - backend_logs:/var/log/signal-lab:ro
      - promtail_data:/tmp
    command: ["-config.file=/etc/promtail/config.yaml"]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  postgres_data:
  root_node_modules:
  backend_node_modules:
  backend_logs:
  frontend_node_modules:
  frontend_next:
  prometheus_data:
  loki_data:
  promtail_data:
  grafana_data:
