server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: signal-lab-backend
    static_configs:
      - targets:
          - localhost
        labels:
          app: signal-lab
          service: backend
          __path__: /var/log/signal-lab/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            context: context
            scenarioType: scenarioType
      - labels:
          level:
          context:
          scenarioType:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
